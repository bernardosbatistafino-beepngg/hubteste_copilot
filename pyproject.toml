[project]
name = "festa-ifc-blumenau"
version = "0.1.0"
description = "Sistema de organização da festa do IFC Campus Blumenau"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymysql>=1.1.1",
    "sqlalchemy>=2.0.36",
    "streamlit>=1.49.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
